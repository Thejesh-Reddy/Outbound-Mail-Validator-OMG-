<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMG · Validation Insights</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17243a;background:#f4f7fb;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}.shell{max-width:1500px;margin:auto;padding:28px 30px 42px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:#172e58;color:white;display:grid;place-items:center;font-weight:800;letter-spacing:-1px}
h1{font-size:23px;margin:0 0 4px;letter-spacing:-.5px}.sub{color:#718096;font-size:13px}.top-actions{display:flex;gap:9px;align-items:center}
button,select,input{font:inherit}.btn{border:1px solid #dce4ef;background:white;color:#30435f;border-radius:9px;padding:9px 13px;font-size:12px;font-weight:650;cursor:pointer}.btn.primary{background:#1e3a67;color:white;border-color:#1e3a67}.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:17px}.stat{background:white;border:1px solid #e5ebf3;border-radius:13px;padding:16px 18px;box-shadow:0 2px 8px #1d35570a}.stat label{display:block;font-size:11px;color:#7b899d;font-weight:650;text-transform:uppercase;letter-spacing:.55px}.stat strong{display:block;font-size:25px;margin-top:7px;letter-spacing:-.7px}.stat.safe strong{color:#11815d}.stat.warn strong{color:#b7791f}.stat.bad strong{color:#c2414e}
.panel{background:white;border:1px solid #e5ebf3;border-radius:13px;box-shadow:0 2px 8px #1d35570a;overflow:hidden}
.filters{padding:16px;border-bottom:1px solid #edf1f6}.filter-grid{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:10px}.control{width:100%;height:39px;border:1px solid #dce4ef;border-radius:8px;padding:0 11px;color:#30435f;background:white;font-size:12px;outline:none}.control:focus{border-color:#6c8fc6;box-shadow:0 0 0 3px #e9f0fb}
.custom-dates{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;margin-left:calc((100% - 20px)/3 + 10px);width:calc((100% - 20px)/3);min-width:0}.custom-dates .date-field{min-width:0;display:grid;gap:5px}.custom-dates .control{width:100%;min-width:0;padding:0 8px}.custom-dates.show{display:grid}.filter-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}.filter-bottom small{color:#8190a4;font-size:11px}.filter-actions{display:flex;gap:8px;align-items:center}.columns-wrap{position:relative}.columns-menu{display:none;position:absolute;right:0;top:42px;z-index:5;background:white;border:1px solid #dce4ef;border-radius:10px;padding:12px;min-width:190px;box-shadow:0 12px 30px #1b2f4a22}.columns-menu.open{display:grid;gap:8px}.columns-menu label{font-size:12px;color:#42536d;display:flex;gap:8px;align-items:center}
.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}thead th{background:#f8fafd;color:#718096;font-size:10px;text-transform:uppercase;letter-spacing:.55px;text-align:left;padding:13px 14px;border-bottom:1px solid #e8edf4;white-space:nowrap;position:sticky;top:0;z-index:1}
tbody td{padding:13px 14px;border-bottom:1px solid #edf1f6;font-size:12px;color:#40516a;vertical-align:middle}tbody tr:hover{background:#fafcff}.subject{font-weight:700;color:#243650;max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell-long{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:#8b98aa;font-size:11px;margin-top:4px}.id{font-family:ui-monospace,monospace;font-size:10px;color:#8290a3}.status{display:inline-flex;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:800;letter-spacing:.35px}.SAFE{background:#e7f6ef;color:#137650}.WARNING{background:#fff4df;color:#9b6412}.RESTRICTED{background:#fdebed;color:#b52e3b}.score{font-weight:750;color:#30435f}.view{border:0;background:transparent;color:#315f9f;font-weight:750;font-size:11px;cursor:pointer;padding:5px}
.table-footer{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;color:#8190a4;font-size:11px}.pager{display:flex;align-items:center;gap:8px}.pager strong{color:#40516a;font-weight:700}
.empty{padding:50px 15px;text-align:center;color:#8290a3;font-size:13px}.error{display:none;margin:14px 16px 0;padding:11px 13px;border-radius:9px;background:#fff0f0;color:#a12f3a;font-size:12px}.error.show{display:block}.loading{opacity:.55;pointer-events:none}
.modal{display:none;position:fixed;inset:0;background:#0c1a2c88;z-index:20;padding:5vh 18px;overflow:auto}.modal.show{display:block}.modal-card{max-width:950px;margin:auto;background:white;border-radius:14px;overflow:hidden;box-shadow:0 22px 70px #06142c44}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 19px;border-bottom:1px solid #e9eef5}.modal-head h2{font-size:15px;margin:0}.modal-body{padding:18px}.json{background:#101c2e;color:#d8e4f5;border-radius:10px;padding:17px;overflow:auto;max-height:68vh;font:11px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.custom-dates{grid-template-columns:repeat(2,minmax(0,1fr));width:calc((100% - 20px)/3);max-width:calc((100% - 20px)/3)}.date-field{display:grid;gap:5px;min-width:0}.date-field label{font-size:11px;font-weight:700;color:#718096}.custom-dates .control{width:100%;min-width:0}

.id-view{border:0;background:transparent;padding:0;cursor:pointer;text-align:left}
.view-details{white-space:nowrap;padding:7px 10px;font-size:11px}
.detail-content{display:grid;gap:14px}
.detail-section{border:1px solid #e5ebf3;border-radius:10px;padding:16px 18px;min-width:0}.detail-section h3{letter-spacing:.02em}
.detail-section h3{font-size:12px;margin:0 0 12px;color:#243650}
.mail-meta{display:grid;grid-template-columns:minmax(76px,110px) minmax(0,1fr);column-gap:18px;row-gap:12px;width:100%;font-size:13px;align-items:start}.mail-meta .meta-label{color:#71819a;font-weight:700;line-height:1.45}.mail-meta .meta-value{color:#263a56;overflow-wrap:anywhere;word-break:normal;white-space:pre-wrap;line-height:1.5;min-width:0}
.mail-body{font-size:13px;line-height:1.65;color:#30435f;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto}
.raw-record{border:1px solid #e5ebf3;border-radius:10px;padding:12px}
.raw-record summary{cursor:pointer;color:#315f9f;font-size:12px;font-weight:700}
.raw-record .json{margin-top:12px}
@media(max-width:600px){.mail-meta{grid-template-columns:1fr;row-gap:4px}.mail-meta .meta-value{margin-bottom:8px}}

@media(max-width:600px){.shell{padding:17px 12px}.top{align-items:flex-start;flex-direction:column}.filter-grid{grid-template-columns:1fr 1fr}.filter-bottom{align-items:flex-start;flex-direction:column}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.custom-dates{margin-left:calc((100% - 10px)/2 + 10px);width:calc((100% - 10px)/2);max-width:calc((100% - 10px)/2);grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><div class="logo">OMG</div><div><h1>Validation Insights</h1><div class="sub">Review and export email security validation records</div></div></div>

  </header>

  <section class="stats">
    <div class="stat"><label>Total Mails</label><strong id="totalCount">—</strong></div>
    <div class="stat safe"><label>Safe</label><strong id="safeCount">—</strong></div>
    <div class="stat warn"><label>Warning</label><strong id="warningCount">—</strong></div>
    <div class="stat bad"><label>Restricted</label><strong id="restrictedCount">—</strong></div>
  </section>

  <section class="panel">
    <div class="filters">
      <div class="filter-grid">
        <select class="control" id="status"><option value="all">All statuses</option><option>SAFE</option><option>WARNING</option><option>RESTRICTED</option></select>
        <select class="control" id="dateFilter"><option value="all">All dates</option><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="last_7_days">Last 7 days</option><option value="custom">Custom range</option></select>
        <select class="control" id="sortOrder"><option value="desc">Descending</option><option value="asc">Ascending</option></select>
      </div>
      <div class="custom-dates" id="customDates"><div class="date-field"><label for="fromDate">From</label><input class="control" type="date" id="fromDate" aria-label="From date"></div><div class="date-field"><label for="toDate">To</label><input class="control" type="date" id="toDate" aria-label="To date"></div></div>
      <div class="filter-bottom">
        <small id="resultSummary">Validation records are shown below. Page size is limited to 50.</small>
        <div class="filter-actions">
          <div class="columns-wrap"><button class="btn" id="columnsBtn">Columns ▾</button><div class="columns-menu" id="columnsMenu">
            <label><input type="checkbox" value="record_id" checked> Record ID</label>
            <label><input type="checkbox" value="subject" checked> Subject</label>
            <label><input type="checkbox" value="sender" checked> Sender</label>
            <label><input type="checkbox" value="content" checked> Content</label>
            <label><input type="checkbox" value="url" checked> URL</label>
            <label><input type="checkbox" value="attachment" checked> Attachment</label>
            <label><input type="checkbox" value="status" checked> Status</label>
            <label><input type="checkbox" value="confidence_score" checked> Confidence</label>
            <label><input type="checkbox" value="created_at" checked> Created At</label>
          </div></div>
          <button class="btn" id="resetBtn">Reset</button>
          <button class="btn" id="csvBtn">Export CSV</button>
          <button class="btn primary" id="excelBtn">Export Excel</button>
        </div>
      </div>
    </div>
    <div class="error" id="errorBox" role="alert"></div>
    <div class="table-scroll">
      <table><thead><tr id="headRow"></tr></thead><tbody id="rows"><tr><td colspan="9" class="empty">Loading validation insights…</td></tr></tbody></table>
    </div>
    <footer class="table-footer"><span id="pageSummary">No records loaded</span><div class="pager"><button class="btn" id="prevBtn" disabled>Previous</button><strong id="pageLabel">Page 1</strong><button class="btn" id="nextBtn" disabled>Next</button></div></footer>
  </section>
</div>

<div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-label="Validation record details">
  <div class="modal-card"><div class="modal-head"><h2 id="detailTitle">Validation record</h2><button class="btn" id="closeModal">Close</button></div><div class="modal-body"><div id="detailContent" class="detail-content">Loading email details…</div><details class="raw-record"><summary>View complete validation record (JSON)</summary><pre class="json" id="detailJson"></pre></details></div></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = {page:1,pageSize:25,total:0,totalPages:0,records:[],statusCounts:{SAFE:0,WARNING:0,RESTRICTED:0},columns:["record_id","subject","sender","content","url","attachment","status","confidence_score","created_at"]};
  const labels = {record_id:"Record ID",subject:"Subject",sender:"From",content:"Content",url:"URL",attachment:"Attachment",status:"Status",confidence_score:"Confidence",created_at:"Created At"};
  const esc = value => String(value ?? "");
  const emailOf = record => record.email && typeof record.email === "object" ? record.email : {};
  const statusOf = record => String(record.status || emailOf(record).status || "UNKNOWN").toUpperCase();
  const scoreOf = record => record.confidence_score ?? emailOf(record).confidence_score ?? "—";
  const dateOf = value => {if(!value)return "—";const d=new Date(value);return Number.isNaN(d.getTime())?esc(value):d.toLocaleString();};
  function params(includePage=true){
    const p=new URLSearchParams();
    if(includePage){p.set("page",state.page);p.set("page_size",state.pageSize);}
    p.set("status",$("status").value);
    p.set("date_filter",$("dateFilter").value);p.set("sort_by","created_at");p.set("sort_order",$("sortOrder").value);
    if($("dateFilter").value==="custom"){if($("fromDate").value)p.set("from_date",$("fromDate").value);if($("toDate").value)p.set("to_date",$("toDate").value);}
    p.set("columns",state.columns.join(","));p.set("tz_offset_minutes",new Date().getTimezoneOffset());
    return p;
  }
  async function api(path){
    const headers={Accept:"application/json"};
    const response=await fetch(path,{headers,credentials:"include",cache:"no-store"});
    const data=await response.json().catch(()=>({detail:"The server returned an unreadable response."}));
    if(!response.ok)throw new Error(data.detail||("Request failed ("+response.status+")"));
    return data;
  }
  function showError(message){$("errorBox").textContent=message||"";$("errorBox").classList.toggle("show",!!message);}
  function renderHead(){
    $("headRow").replaceChildren();
    state.columns.forEach(key=>{const th=document.createElement("th");th.textContent=labels[key];$("headRow").append(th);});const actionHead=document.createElement("th");actionHead.textContent="Action";$("headRow").append(actionHead);
  }
  function cellFor(record,key){
    const email=emailOf(record);
    if(key==="record_id")return record._id||"";
    if(key==="subject")return email.subject||record.subject||"—";
    if(key==="sender")return email.from||record.user_email||"—";
    if(key==="content")return email.body||record.content||(typeof record.text==="string"?record.text:JSON.stringify(record.text||""));
    if(key==="url")return record.url??email.url??"";
    if(key==="attachment")return record.attachments??record.attachment??"";
    if(key==="status")return statusOf(record);
    if(key==="confidence_score")return scoreOf(record);
    if(key==="created_at")return dateOf(record.created_at);
    return "";
  }
  function renderRows(){
    renderHead();const body=$("rows");body.replaceChildren();
    if(!state.records.length){const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=state.columns.length+1;td.className="empty";td.textContent="No validation records match these filters.";tr.append(td);body.append(tr);return;}
    state.records.forEach(record=>{
      const tr=document.createElement("tr");
      state.columns.forEach(key=>{
        const td=document.createElement("td");const value=cellFor(record,key);
        if(key==="subject"){const main=document.createElement("div");main.className="subject";main.textContent=esc(value);td.append(main);}
        else if(key==="status"){const badge=document.createElement("span");badge.className="status "+statusOf(record);badge.textContent=statusOf(record);td.append(badge);}
        else if(key==="confidence_score"){const score=document.createElement("span");score.className="score";score.textContent=esc(value)+(typeof value==="number"?" / 100":"");td.append(score);}
        else if(key==="record_id"){const id=document.createElement("button");id.className="id id-view";id.type="button";id.textContent=esc(value);id.title="Open complete JSON record";id.addEventListener("click",()=>showDetail(record));td.append(id);}
        else if(["content","url","attachment"].includes(key)){td.className="cell-long";td.textContent=esc(value);td.title=esc(value);}
        else td.textContent=esc(value);
        tr.append(td);
      });
      const actionCell=document.createElement("td");
      const viewButton=document.createElement("button");
      viewButton.type="button";viewButton.className="btn view-details";
      viewButton.textContent="View Details";
      viewButton.addEventListener("click",()=>showDetail(record));
      actionCell.append(viewButton);tr.append(actionCell);
      body.append(tr);
    });
  }
  function updateStats(){
    $("totalCount").textContent=state.total.toLocaleString();
    $("safeCount").textContent=state.statusCounts.SAFE||0;
    $("warningCount").textContent=state.statusCounts.WARNING||0;
    $("restrictedCount").textContent=state.statusCounts.RESTRICTED||0;
  }
  async function load(){
    $("rows").parentElement.classList.add("loading");showError("");
    try{
      const data=await api("/api/v1/omg_insights_view?"+params().toString());
      state.records=Array.isArray(data.records)?data.records:[];state.statusCounts=data.status_counts||{SAFE:0,WARNING:0,RESTRICTED:0};const pg=data.pagination||{};
      state.total=pg.total_records||0;state.totalPages=pg.total_pages||0;state.page=pg.page||state.page;
      renderRows();updateStats();
      const start=state.total?((state.page-1)*state.pageSize+1):0,end=Math.min(state.page*state.pageSize,state.total);
      $("resultSummary").textContent=`Showing ${start}–${end} of ${state.total.toLocaleString()} validation records`;
      $("pageSummary").textContent=`${state.total.toLocaleString()} total validation records · ${state.pageSize} per page`;
      $("pageLabel").textContent=`Page ${state.page} of ${Math.max(state.totalPages,1)}`;
      $("prevBtn").disabled=state.page<=1;$("nextBtn").disabled=state.page>=state.totalPages;
    }catch(error){showError(error.message);state.records=[];renderRows();updateStats();}
    finally{$("rows").parentElement.classList.remove("loading");}
  }
  function addMetaRow(container,label,value){
    const labelNode=document.createElement("div");labelNode.className="meta-label";labelNode.textContent=label;
    const valueNode=document.createElement("div");valueNode.className="meta-value";
    valueNode.textContent=value==null||value===""?"—":(typeof value==="object"?JSON.stringify(value,null,2):String(value));
    container.append(labelNode,valueNode);
  }
  function renderEmailDetail(record){
    const root=$("detailContent");root.replaceChildren();
    const email=emailOf(record);
    const section=(title)=>{
      const box=document.createElement("section");
      box.className="detail-section";
      const heading=document.createElement("h3");
      heading.textContent=title;
      box.append(heading);
      root.append(box);
      return box;
    };
    const meta=section("EMAIL DETAILS");
    const metaGrid=document.createElement("div");
    metaGrid.className="mail-meta";
    addMetaRow(metaGrid,"Subject",email.subject||record.subject);
    addMetaRow(metaGrid,"From",email.from||record.user_email);
    addMetaRow(metaGrid,"To",email.to||record.to);
    addMetaRow(metaGrid,"CC",email.cc||record.cc);
    addMetaRow(metaGrid,"Date",dateOf(record.created_at||email.date));
    meta.append(metaGrid);

    const body=section("EMAIL CONTENT");
    const bodyText=email.body??email.text??record.content??record.text??record.body??"Email body is not available in this validation record.";
    const bodyNode=document.createElement("div");
    bodyNode.className="mail-body";
    bodyNode.textContent=typeof bodyText==="string"?bodyText:JSON.stringify(bodyText,null,2);
    body.append(bodyNode);

    const validation=section("VALIDATION RESULT");
    const resultMeta=document.createElement("div");
    resultMeta.className="mail-meta";
    addMetaRow(resultMeta,"Status",statusOf(record));
    addMetaRow(resultMeta,"Confidence",scoreOf(record));
    addMetaRow(resultMeta,"URLs",record.url??email.url);
    addMetaRow(resultMeta,"Attachments",record.attachments??record.attachment);
    validation.append(resultMeta);
  }
  async function showDetail(record){
    $("detailTitle").textContent="Email Details · "+(record._id||"");
    $("detailContent").textContent="Loading complete email details…";
    $("detailJson").textContent="Loading complete validation record…";
    $("detailModal").classList.add("show");
    try{
      const data=await api("/api/v1/omg_insights_view/"+encodeURIComponent(record._id));
      const completeRecord=data.record||data;
      renderEmailDetail(completeRecord);
      $("detailJson").textContent=JSON.stringify(completeRecord,null,2);
    }catch(error){
      renderEmailDetail(record);
      $("detailJson").textContent=JSON.stringify(record,null,2)+"\n\nCould not retrieve the complete record: "+error.message;
    }
  }
  function selectedColumns(){return [...$("columnsMenu").querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.value);}
  async function exportFile(format){
    try{
      showError("");const query=params(false);query.set("format",format);
      const headers={};
      const response=await fetch("/api/v1/omg_insights_view/export?"+query.toString(),{headers,credentials:"include",cache:"no-store"});
      if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.detail||"Export failed");}
      const blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download=format==="csv"?"omg_validation_insights.csv":"omg_validation_insights.xlsx";document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);
    }catch(error){showError(error.message);}
  }
  ["status","dateFilter","sortOrder","fromDate","toDate"].forEach(id=>$(id).addEventListener("change",()=>{if(id==="dateFilter")$("customDates").classList.toggle("show",$("dateFilter").value==="custom");state.page=1;load();}));
  $("prevBtn").addEventListener("click",()=>{if(state.page>1){state.page--;load();}});
  $("nextBtn").addEventListener("click",()=>{if(state.page<state.totalPages){state.page++;load();}});
  $("resetBtn").addEventListener("click",()=>{$("status").value="all";$("dateFilter").value="all";$("fromDate").value="";$("toDate").value="";$("customDates").classList.remove("show");$("sortOrder").value="desc";state.page=1;load();});
  $("columnsBtn").addEventListener("click",()=>$("columnsMenu").classList.toggle("open"));
  $("columnsMenu").addEventListener("change",()=>{const next=selectedColumns();if(next.length){state.columns=next;renderRows();}});
  $("csvBtn").addEventListener("click",()=>exportFile("csv"));$("excelBtn").addEventListener("click",()=>exportFile("xlsx"));
  $("closeModal").addEventListener("click",()=>$("detailModal").classList.remove("show"));
  $("detailModal").addEventListener("click",e=>{if(e.target===$("detailModal"))$("detailModal").classList.remove("show");});
  renderHead();
  load();
})();
</script>
</body>
</html>
